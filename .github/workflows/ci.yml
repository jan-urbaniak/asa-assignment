name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, test-notify]

    steps:
      - uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build --tag vulntracker-api:${{ github.sha }} .

      - name: Create container report directory
        run: mkdir -p reports

      - name: Scan FastAPI image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vulntracker-api:${{ github.sha }}
          scanners: vuln
          format: json
          output: reports/container.trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: reports/container.trivy.json
          if-no-files-found: error

      - name: Start FastAPI container
        run: |
          docker run --detach --rm \
            --name vulntracker-api-ci \
            --publish 8000:8000 \
            --env SECRET_KEY="ci-only-test-signing-key" \
            --env NOTIFY_SERVICE_KEY="ci-only-test-service-key" \
            --env PUBLIC_BASE_URL="http://localhost:8000" \
            vulntracker-api:${{ github.sha }}

      - name: Verify container health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs vulntracker-api-ci
          exit 1

      - name: Stop FastAPI container
        if: always()
        run: docker stop vulntracker-api-ci || true



  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep Community Edition
        run: pipx install semgrep

      - name: Run Semgrep for Python and Node.js source code
        id: semgrep
        continue-on-error: true
        run: |
          mkdir -p reports
          semgrep scan --config p/default --json \
            --output reports/sast.semgrep.json app notify/src

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast.semgrep.json
          path: reports/sast.semgrep.json
          if-no-files-found: error

      - name: Fail on Semgrep ERROR findings
        if: always()
        run: |
          jq -e '
            [.results[]
             | select(.extra.severity == "ERROR")]
            | length == 0
          ' reports/sast.semgrep.json

  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create report directory
        run: mkdir -p reports

      - name: Run OSV-Scanner for Python and Node.js dependencies
        id: osv
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" \
            --workdir /src \
            ghcr.io/google/osv-scanner:v2.5.1 \
            scan --config .osv-scanner.toml \
            -L requirements.txt -L notify/package-lock.json --format json \
            --output-file reports/sca.osv-scanner.json

      - name: Upload OSV-Scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca.osv-scanner.json
          path: reports/sca.osv-scanner.json
          if-no-files-found: error

      - name: Fail on SCA findings
        if: always()
        run: |
          jq -e '
            [.results[]?.packages[]?.groups[]?.ids[]?]
            | length == 0
          ' reports/sca.osv-scanner.json

  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create IaC report directory
        run: mkdir -p reports

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5

      - name: Install Checkov
        run: pipx install checkov==3.2.500

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: v0.61.0

      - name: Lint Terraform
        working-directory: terraform
        run: |
          tflint --init
          tflint --format compact

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Scan Terraform with Checkov
        id: checkov
        continue-on-error: true
        run: |
          checkov -d terraform \
            --framework terraform \
            --output json \
            --quiet \
            > reports/iac.checkov.json

      - name: Upload Checkov IaC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: reports/iac.checkov.json
          if-no-files-found: error
      - name: Fail on Checkov findings
        if: always()
        run: |
          jq -e '([.results.failed_checks[]?] | length) == 0' \
            reports/iac.checkov.json
