name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep Community Edition
        run: pipx install semgrep

      - name: Run Semgrep for Python and Node.js source code
        id: semgrep
        continue-on-error: true
        run: |
          mkdir -p reports
          semgrep scan --config p/default --json \
            --output reports/sast.semgrep.json app notify/src

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast.semgrep.json
          path: reports/sast.semgrep.json
          if-no-files-found: error

      - name: Fail on Semgrep ERROR findings
        if: always()
        run: |
          jq -e '
            [.results[]
             | select(.extra.severity == "ERROR")]
            | length == 0
          ' reports/sast.semgrep.json

  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create report directory
        run: mkdir -p reports

      - name: Run OSV-Scanner for Python and Node.js dependencies
        id: osv
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" \
            --workdir /src \
            ghcr.io/google/osv-scanner:latest \
            scan -L requirements.txt -L notify/package-lock.json --format json \
            --output-file reports/sca.osv-scanner.json

      - name: Upload OSV-Scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca.osv-scanner.json
          path: reports/sca.osv-scanner.json
          if-no-files-found: error

      - name: Fail on SCA findings
        if: always()
        run: |
          jq -e '
            [.results[]?.packages[]?.groups[]?.ids[]?]
            | length == 0
          ' reports/sca.osv-scanner.json

  # TODO (candidates): Add the following security scanning jobs.
  #
  # container-scan:
  #   Build the Docker image, then scan it for vulnerabilities and misconfigurations
  #   Upload JSON report as a build artifact named container.<tool>.json
  #
  # iac-scan:
  #   Scan the Helm chart or Terraform configuration for security misconfigurations
  #   Upload JSON report as a build artifact named iac.<tool>.json
